name: Tinfoil Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}

permissions: {}

jobs:
  validate-release:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require default branch and strict version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be strict SemVer in the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

  prepare-release:
    name: Create release tag
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Create the release tag
        uses: tinfoilsh/update-container-action@5e0a3789316941664cee055706799114e0180565 # v0.6.0
        with:
          version: ${{ inputs.version }}
          source-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch the publish workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
